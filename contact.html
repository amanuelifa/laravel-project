<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us</title>
  <link rel="stylesheet" href="con.css">
</head>
<body>
  <div class="contact-container">
    <h1>Contact Us</h1>
    <p>Feel free to get in touch with us. We'd love to hear from you!</p>
    <form action="Thanksforcontact.html" method="post">
      <label for="name">Name:</label>
      <input type="text" id="name" name="user_name" placeholder="Your name" required>
      
      <label for="email">Email:</label>
      <input type="email" id="email" name="user_email" placeholder="Your email" required>
      
      <label for="message">Message:</label>
      <textarea id="message" name="user_message" placeholder="Your message" required></textarea>
      
      <input type="submit" value="Send Message">
    </form>
  </div>
</body>
</html>
