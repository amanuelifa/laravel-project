<style type="text/css">
.navbar {
  background-color: #333;
  overflow: hidden;
}

.nav-links {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
}

.nav-links li {
  flex: 1;
}

.nav-links a {
  display: block;
  color: white;
  text-align: center;
  padding: 14px 16px;
  text-decoration: none;
  transition: background-color 0.3s;
}
.nav-links a:hover {
  background-color: #555;
  transition: background-color 0.3s;
}
.nav-links a::after {
  content: '';
  display: block;
  width: 0;
  height: 2px;
  background-color: #fff;
  transition: width 0.3s;
}

.nav-links a:hover::after {
  width: 100%;
  transition: width 0.3s;
}
</style>
